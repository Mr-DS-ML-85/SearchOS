name: searchos

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-searchos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-searchos}
      POSTGRES_DB: ${POSTGRES_DB:-searchos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-searchos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  renderer:
    build:
      context: ./services/renderer
      dockerfile: Dockerfile
    environment:
      RENDER_TIMEOUT_MS: ${RENDER_TIMEOUT_MS:-30000}
      MAX_RENDER_BYTES: ${RENDER_MAX_BYTES:-10485760}
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-4}
    ports:
      - "${RENDERER_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8010/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  searxng:
    profiles: ["web"]
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8080}/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-to-a-long-random-secret}
      SEARXNG_SINGLE_USER: ${SEARXNG_SINGLE_USER:-admin:admin}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${GATEWAY_WORKERS:-2}"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-searchos}:${POSTGRES_PASSWORD:-searchos}@postgres:5432/${POSTGRES_DB:-searchos}
      REDIS_URL: redis://redis:6379/0
      RENDERER_URL: ${RENDERER_URL:-http://renderer:8010}
      SEARXNG_URL: ${SEARXNG_URL:-}
      BOOTSTRAP_ADMIN_API_KEY: ${BOOTSTRAP_ADMIN_API_KEY:?set BOOTSTRAP_ADMIN_API_KEY in .env}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      renderer:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    command: ["python", "worker_entrypoint.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-searchos}:${POSTGRES_PASSWORD:-searchos}@postgres:5432/${POSTGRES_DB:-searchos}
      REDIS_URL: redis://redis:6379/0
      RENDERER_URL: ${RENDERER_URL:-http://renderer:8010}
      BOOTSTRAP_ADMIN_API_KEY: ${BOOTSTRAP_ADMIN_API_KEY:?set BOOTSTRAP_ADMIN_API_KEY in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-searchos}:${POSTGRES_PASSWORD:-searchos}@postgres:5432/${POSTGRES_DB:-searchos}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROM_RETENTION:-30d}"
    ports:
      - "9090:9090"
    depends_on:
      - gateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
