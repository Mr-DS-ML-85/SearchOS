name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('services/gateway/requirements*.txt', 'services/gateway/pyproject.toml') }}
          restore-keys: |
            pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r services/gateway/requirements-dev.txt

      - name: Lint (compile check)
        run: |
          python -m compileall -q services/gateway/app
          python -m compileall -q services/mcp
          python -m compileall -q tools

      - name: Run tests
        run: |
          python -m pytest tests -q

  docker-build:
    name: Docker build (gateway + renderer)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Create .env with test keys
        run: |
          echo "BOOTSTRAP_ADMIN_API_KEY=sk_ci_test_only_${{ github.run_id }}_not_a_real_key" >> .env

      - name: Build gateway image
        run: docker compose build gateway

      - name: Build renderer image
        run: docker compose build renderer
