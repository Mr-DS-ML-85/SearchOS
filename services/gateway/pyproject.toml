[project]
name = "searchos-gateway"
version = "1.0.0"
description = "Self-hosted search API and web index (own search engine)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "redis>=5.0",
    "trafilatura>=1.8",
    "pypdf>=4.2",
    "prometheus-client>=0.20",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    # tests/test_mcp.py and tests/test_mcp_e2e.py import services/mcp/searchos_mcp.py,
    # which needs mcp_types. It arrives via the mcp SDK, but the gateway's own
    # test extra never declared it, so 37 tests errored on collection.
    "mcp>=2.0",
]
# Opt-in: pulls torch + CUDA wheels (~3 GB). Without it the gateway runs
# FTS-only and the `vector` provider reports itself unavailable, which is the
# documented degraded mode (see app/embed/provider.py `available`).
embeddings = [
    "sentence-transformers>=2.7",
]
# Opt-in: CLIP for image/multimodal search. Pillow is needed to decode images;
# torchvision is deliberately NOT included — CLIPImageProcessor requires it, and
# the preprocessing here is done with numpy instead, which avoids a ~800MB
# dependency for four lines of resize/normalise.
images = [
    "pillow>=10.0",
]
full = [
    "sentence-transformers>=2.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "alembic", "alembic.ini", "worker.py", "worker_entrypoint.py"]
