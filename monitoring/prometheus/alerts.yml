groups:
  - name: searchos
    rules:
      - alert: GatewayDown
        expr: up{job="gateway"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SearchOS gateway is down"

      - alert: HighErrorRate
        expr: rate(searchos_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on gateway"

      - alert: ProviderFailures
        expr: rate(searchos_provider_errors_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Multiple search provider errors detected"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(searchos_search_duration_seconds_bucket[5m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "P95 search latency above 5s"

      - alert: QueueBacklog
        expr: searchos_queue_depth > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ingest queue backlog growing"

      - alert: RateLimitRejections
        expr: rate(searchos_rate_limited_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate-limit rejections"
